<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BUYEasy - Secure Router</title>

<style>
body {
  background: #0f0f0f;
  color: #fff;
  font-family: Inter, system-ui;
  display: grid;
  place-items: center;
  height: 100vh;
  margin: 0;
}
.card {
  background: #1a1a1a;
  border: 1px solid #222;
  padding: 20px 26px;
  border-radius: 18px;
  text-align: center;
  min-width: 260px;
}
.loader {
  width: 28px;
  height: 28px;
  border: 3px solid #222;
  border-top-color: #22c55e;
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin: 0 auto 12px;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="card">
  <div class="loader"></div>
  <div style="font-weight:900">BUYEasy</div>
  <div id="msg" style="font-size:12px;color:#888;margin-top:6px">
    Checking secure session...
  </div>
</div>

<!-- Supabase library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>

<!-- Your Supabase configuration -->
<script src="supabase.js"></script>

<script>
(async function() {

  const msg = document.getElementById('msg');

  try {

    if (!window.supabaseClient) {
      throw new Error('Supabase connection unavailable.');
    }

    // Verify the authenticated user.
    const { data: userData, error: userError } =
      await window.supabaseClient.auth.getUser();

    if (userError || !userData.user) {
    msg.textContent = 'No active session. Please log in first.';

    document.querySelector('.loader').style.display = 'none';

    return;
}

    const user = userData.user;

    // Retrieve the user's actual database role.
    const { data: profile, error: profileError } =
      await window.supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', user.id)
        .single();

    if (profileError || !profile) {
      throw new Error('Your account profile could not be found.');
    }

    const role = profile.role;

    if (role !== 'admin') {
      const { data: acct } = await window.supabaseClient.rpc('my_account_status');
      if (acct === 'suspended') {
        throw new Error('Your account has been suspended. Contact BuyEasy support.');
      }
    }

    // Save email for temporary compatibility with existing dashboards.
    // The Supabase session remains the source of authentication.
    localStorage.setItem('bhv2_email', user.email);
    localStorage.setItem('bhv2_role', role);

    msg.textContent = 'Verified: ' + role + '. Redirecting...';

    // Route according to the database role.
    if (role === 'buyer') {
      location.replace('buyer-dashboard.html');
    }

    else if (role === 'store') {
      location.replace('store-dashboard.html');
    }

    else if (role === 'rider') {
      location.replace('rider-dashboard.html');
    }

    else if (role === 'admin') {
      location.replace('admin/dashboard.html');
    }

    else {
      throw new Error('Unknown account role.');
    }

  } catch (error) {

    console.error('BUYEasy routing error:', error);

    msg.textContent = error.message;

    // Do not silently create an insecure local session.
    await window.supabaseClient.auth.signOut();

    setTimeout(() => {
      location.replace('index.html');
    }, 2500);

  }

})();
</script>

</body>
</html>
