<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BuyEasy Admin</title>
<meta name="theme-color" content="#22c55e">
<link rel="icon" href="../icon-192.png">
<style>
:root{--bg:#0b0d0c;--card:#131615;--card2:#1a1e1c;--line:#262b29;--text:#f2f5f3;--muted:#8d9a93;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;font-size:14px}
header{position:sticky;top:0;z-index:20;background:rgba(11,13,12,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;max-width:1100px;margin:0 auto}
.brand{font-weight:900;font-size:17px;letter-spacing:-.3px}.brand span{color:var(--green)}
.out{background:transparent;border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:10px;font-weight:700;cursor:pointer}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;max-width:1100px;margin:0 auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:9px 14px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--green);color:#04210f;border-color:var(--green)}
nav .dot{display:inline-block;min-width:18px;padding:1px 6px;margin-left:6px;border-radius:999px;background:var(--red);color:#fff;font-size:11px}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{font-size:18px;margin:4px 0 12px}h3{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:7px 12px;border-radius:999px;font-weight:700;font-size:12px;cursor:pointer}.chip.on{background:var(--text);color:#0b0d0c;border-color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.kpi small{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.kpi b{display:block;font-size:24px;margin-top:6px;letter-spacing:-.5px}.kpi i{font-style:normal;color:var(--muted);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.funnel .step{margin:10px 0}.funnel .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar{height:12px;background:var(--card2);border-radius:8px;overflow:hidden}.bar>div{height:100%;background:var(--green);border-radius:8px;min-width:2px}
.stack{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--card2)}.stack>div{height:100%}
.item{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}
.item .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.item .m{color:var(--muted);font-size:12px;margin-top:3px;word-break:break-word}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800}
.t-g{background:rgba(34,197,94,.15);color:#4ade80}.t-a{background:rgba(245,158,11,.15);color:#fbbf24}.t-r{background:rgba(239,68,68,.15);color:#f87171}.t-b{background:rgba(59,130,246,.15);color:#60a5fa}.t-n{background:#262b29;color:#aab5ae}
.btn{border:0;border-radius:10px;padding:8px 12px;font-weight:800;font-size:12px;cursor:pointer;color:#fff;background:#2c332f}.btn.g{background:var(--green);color:#04210f}.btn.r{background:#b91c1c}.btn.a{background:#b45309}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
input,select,textarea{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;max-width:100%}textarea{width:100%;min-height:70px}
.empty{color:var(--muted);text-align:center;padding:26px 10px}.err{color:#f87171;padding:14px}.stars{color:var(--amber);letter-spacing:1px}
.two{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:800px){.two{grid-template-columns:1fr 1fr}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:#0b0d0c;padding:11px 18px;border-radius:12px;font-weight:800;z-index:50;display:none}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;padding:6px 8px;letter-spacing:.5px}td{padding:9px 8px;border-top:1px solid var(--line)}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<header>
  <div class="top"><div class="brand">Buy<span>Easy</span> Admin</div><button class="out" onclick="adminLogout()">Log out</button></div>
  <nav id="nav"></nav>
</header>
<main id="view"><div class="empty">Loading…</div></main>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="../supabase.js"></script>
<script src="../net-status.js"></script>
<script src="admin-auth.js"></script>
<script src="admin-app.js"></script>
</body>
</html>
