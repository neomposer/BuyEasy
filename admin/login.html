
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | OnekidNeomposer</title>

    <link rel="stylesheet" href="../style.css">

    <style>
        :root {
            --bg: #0a0a0a;
            --card: #111;
            --card2: #151515;
            --border: #222;
            --text: #fff;
            --muted: #777;
            --green: #22c55e;
            --red: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: Inter, system-ui, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .login-wrap {
            width: 100%;
            max-width: 380px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,.6);
        }

        .logo {
            font-weight: 900;
            font-size: 22px;
            letter-spacing: -1px;
            text-align: center;
        }

        .logo span {
            color: var(--green);
        }

        .sub {
            color: var(--muted);
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
        }

        .badge {
            font-size: 10px;
            padding: 5px 10px;
            border-radius: 20px;
            background: #222;
            color: #aaa;
            border: 1px solid #333;
            display: inline-block;
            margin-top: 16px;
        }

        .field-label {
            display: block;
            color: #bbb;
            font-size: 12px;
            margin-top: 18px;
        }

        .field {
            width: 100%;
            padding: 13px 14px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            background: var(--card2);
            color: var(--text);
            margin-top: 7px;
            font-size: 14px;
            outline: none;
        }

        .field:focus {
            border-color: var(--green);
        }

        .btn {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: none;
            background: var(--text);
            color: var(--bg);
            font-weight: 900;
            cursor: pointer;
            margin-top: 20px;
            font-size: 14px;
        }

        .btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .alert {
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 12px;
            margin-top: 12px;
            display: none;
        }

        .alert.err {
            background: rgba(239,68,68,.12);
            color: #ef4444;
            border: 1px solid rgba(239,68,68,.3);
        }

        .alert.ok {
            background: rgba(34,197,94,.12);
            color: #22c55e;
            border: 1px solid rgba(34,197,94,.3);
        }

        .forgot {
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            margin-top: 18px;
            cursor: pointer;
            text-decoration: underline;
        }

        .forgot:hover {
            color: var(--green);
        }

        .footer {
            font-size: 10px;
            color: #555;
            text-align: center;
            margin-top: 24px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="login-wrap">

        <div class="logo">
            ONEKIDNEOMPOSER<span> ADMIN</span>
        </div>

        <div class="sub">
            Secure administrator access
        </div>

        <div style="text-align:center">
            <span class="badge">🔒 SUPABASE AUTHENTICATION</span>
        </div>

        <form id="adminLoginForm" onsubmit="event.preventDefault(); adminLogin();">

            <label class="field-label" for="email">
                Administrator email
            </label>

            <input
                id="email"
                name="email"
                type="email"
                class="field"
                placeholder="Enter your admin email"
                autocomplete="username"
                required
            >

            <label class="field-label" for="pass">
                Password
            </label>

            <input
                id="pass"
                name="password"
                type="password"
                class="field"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button
                id="loginBtn"
                type="submit"
                class="btn"
            >
                Log In
            </button>

        </form>

        <div id="err" class="alert err" role="alert"></div>

        <div id="ok" class="alert ok" role="status"></div>

        <div class="forgot" onclick="forgot()">
            Forgot password?
        </div>

        <div class="footer">
            Authorised administrators only.<br>
            Access is verified through Supabase.
        </div>

    </div>
<!-- ADMIN SCRIPT CHECK -->
    <!-- Load Supabase JavaScript library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>

<!-- Initialise your Supabase connection -->
<script src="../supabase.js"></script>

<!-- Load admin authentication -->
<script src="admin-auth.js"></script>

</body>
</html>
