<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BUYEasy Admin - Reset password</title>
<style>
  body{background:#0f0f0f;color:#fff;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0}
  .card{background:#1a1a1a;border:1px solid #222;padding:24px;border-radius:18px;width:min(92vw,360px)}
  h1{font-size:18px;margin:0 0 14px}
  input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff}
  button{width:100%;padding:13px;border:0;border-radius:10px;background:#22c55e;color:#000;font-weight:800;cursor:pointer}
  button:disabled{opacity:.6}
  #msg{font-size:13px;margin-top:12px;min-height:18px}
  .err{color:#ef4444}.ok{color:#22c55e}
</style>
</head>
<body>
<div class="card">
  <h1>Set a new password</h1>
  <label for="p1">New password (min 8 characters)</label>
  <input id="p1" type="password" autocomplete="new-password">
  <label for="p2">Repeat password</label>
  <input id="p2" type="password" autocomplete="new-password">
  <button id="btn" type="button">Save password</button>
  <div id="msg"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="../supabase.js"></script>
<script>
(function(){
  const db = window.supabaseClient;
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');
  const show = (t, cls) => { msg.textContent = t; msg.className = cls || ''; };
  btn.addEventListener('click', async () => {
    const a = document.getElementById('p1').value, b = document.getElementById('p2').value;
    if (a.length < 8) return show('Use at least 8 characters.', 'err');
    if (a !== b) return show('Passwords do not match.', 'err');
    btn.disabled = true;
    try {
      const { data } = await db.auth.getSession();
      if (!data.session) throw new Error('This reset link has expired. Request a new one from the login page.');
      const { error } = await db.auth.updateUser({ password: a });
      if (error) throw error;
      show('Password updated. Redirecting to login…', 'ok');
      await db.auth.signOut();
      setTimeout(() => location.replace('login.html'), 1200);
    } catch (e) { show(e.message || 'Could not update password.', 'err'); btn.disabled = false; }
  });
})();
</script>
</body>
</html>
